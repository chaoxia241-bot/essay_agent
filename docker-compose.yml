# 本地依赖服务
# 用法：docker compose up -d
#
# Neo4j：本机已安装桌面版/服务版时，注释掉 neo4j 段，改连 bolt://localhost:7687
#        （configs/app.yaml 中 storage.graph.uri）
services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: litagent-qdrant
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5.20.0
    container_name: litagent-neo4j
    ports:
      - "7474:7474" # Browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-litagent_dev}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

volumes:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
